---
- name: Get RPM's own matches for the selector
  ansible.builtin.command:
    argv: [rpm, --query, --all, --queryformat, '%{NVRA}\n', "name={{ rpm_info_pattern }}"]
  environment:
    LC_ALL: C
  register: rpm_info_native
  changed_when: false

- name: Query the same selector through the module
  community.general.rpm_info:
    name: ["{{ rpm_info_pattern }}"]
    include: [metadata]
  register: rpm_info_matching

- name: Check native selector results are preserved
  ansible.builtin.assert:
    that:
      - not rpm_info_matching.changed
      - rpm_info_matching.packages | map(attribute='nvra') | sort | list == rpm_info_native.stdout_lines | sort
